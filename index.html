<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smarty Stars</title>
<meta name="description" content="Learning games for kids ages 4 to 8: letters, counting, spelling and money.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4F5EA; --paper:#FFFFFF; --text:#2B1B3D; --line:#2B1B3D; --soft:#6A5A7E;
  --sun:#FFD23F; --tomato:#FF6B5E; --sky:#45C4E0; --grass:#5BD17D; --grape:#9B6BF7; --pink:#FF8FC7;
  --on:#2B1B3D; --dot:rgba(43,27,61,.07); --ghost:rgba(43,27,61,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1430; --paper:#2D2347; --text:#F7F1FF; --line:#0A0614; --soft:#BFB1D8;
    --dot:rgba(255,255,255,.05); --ghost:rgba(255,255,255,.22); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1430; --paper:#2D2347; --text:#F7F1FF; --line:#0A0614; --soft:#BFB1D8;
  --dot:rgba(255,255,255,.05); --ghost:rgba(255,255,255,.22); color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);background-image:radial-gradient(var(--dot) 2px,transparent 2.6px);background-size:22px 22px;color:var(--text);font-family:"Baloo 2",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;line-height:1.3}
#app{max-width:720px;margin:0 auto;padding:12px 14px 32px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
img,svg{max-width:100%}
.card{background:var(--paper);border:3px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);color:var(--text)}
button.card:active:not(:disabled),.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:6px 24px;border:3px solid var(--line);border-radius:999px;box-shadow:0 5px 0 var(--line);font-weight:800;font-size:1.25rem;background:var(--sun);color:var(--on)}
.btn.alt{background:var(--paper);color:var(--text)}
.btn.go{background:var(--grass)}
.btn.red{background:var(--tomato)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.muted{color:var(--soft)}
h1,h2,h3{margin:0;line-height:1.1}

/* Wordmark */
.mark{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;margin:14px 0 6px}
.mark .w{display:flex;gap:2px;flex-wrap:nowrap}
.mark .L{display:inline-grid;place-items:center;min-width:1.15em;height:1.3em;padding:0 .08em;font-size:clamp(1.9rem,8vw,3.1rem);font-weight:800;color:var(--on);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line);line-height:1}
.mark .c0{background:var(--tomato);transform:rotate(-5deg)}
.mark .c1{background:var(--sun);transform:rotate(3deg)}
.mark .c2{background:var(--sky);transform:rotate(-2deg)}
.mark .c3{background:var(--grass);transform:rotate(4deg)}
.mark .c4{background:var(--pink);transform:rotate(-3deg)}
.sub{font-size:1.35rem;font-weight:700;text-align:center;margin:10px 0 18px}

/* Players */
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;align-items:center;padding:12px 8px 10px;position:relative;min-height:190px;justify-content:center}
.pcard .av{width:110px;height:120px}
.av svg{display:block;width:100%;height:100%}
.pcard .nm{font-weight:800;font-size:1.35rem;overflow-wrap:anywhere;text-align:center}
.pcard .st{font-weight:700;color:var(--soft)}
.pcard.add{background:transparent;border-style:dashed;border-color:var(--soft);box-shadow:none;font-size:1.2rem;font-weight:800;gap:6px}
.pcard.add .plus{font-size:3rem;line-height:1}
.pcard .edit{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;background:var(--sun);border:3px solid var(--line);display:grid;place-items:center;font-size:1.1rem;color:var(--on)}
.linkbtn{display:block;margin:22px auto 0;font-weight:700;color:var(--soft);text-decoration:underline;font-size:1.05rem;min-height:44px}

/* Top bar */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.iconbtn{width:52px;height:52px;flex:none;border-radius:50%;border:3px solid var(--line);background:var(--paper);box-shadow:0 4px 0 var(--line);font-size:1.5rem;display:grid;place-items:center}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.bar-title{flex:1;font-weight:800;font-size:1.4rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{display:flex;align-items:center;gap:6px;background:var(--sun);color:var(--on);border:3px solid var(--line);border-radius:999px;padding:2px 12px 2px 2px;box-shadow:0 4px 0 var(--line)}
.me-av{width:42px;height:46px;border-radius:50%;background:var(--paper);overflow:hidden;display:grid;place-items:center}
.me-av svg{width:44px;height:52px;margin-top:6px}
.stars{font-weight:800;font-size:1.2rem;white-space:nowrap}

/* Home */
.hello{display:flex;align-items:center;gap:14px;margin:4px 0 18px}
.hello .av{width:96px;height:106px;flex:none}
.hello h2{font-size:1.9rem;overflow-wrap:anywhere}
.hello .st{font-size:1.25rem;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{padding:14px 12px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:150px;color:var(--on)}
.tile .emo{font-size:2.8rem;line-height:1.1}
.tile .tn{font-weight:800;font-size:1.3rem;line-height:1.1;margin-top:auto}
.tile .ts{font-size:.98rem;font-weight:600;opacity:.8}
.homebtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.homebtns .btn{font-size:1.1rem;padding:6px 10px}

/* Avatar editor */
.look-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.look-prev{width:150px;height:166px;flex:none;background:var(--paper);border:3px solid var(--line);border-radius:28px;box-shadow:0 5px 0 var(--line);display:grid;place-items:center;overflow:hidden}
.look-prev svg{width:140px;height:170px;margin-top:14px}
.look-info{flex:1;min-width:0}
.look-info h2{font-size:1.6rem;overflow-wrap:anywhere}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:6px 0 4px}
.tab{flex:none;min-height:46px;padding:4px 16px;border-radius:999px;border:3px solid var(--line);background:var(--paper);font-weight:800;font-size:1.05rem}
.tab.on{background:var(--grape);color:#fff}
.grouph{font-weight:800;font-size:1.15rem;margin:12px 0 8px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 4px 6px;min-height:118px;overflow:hidden}
.item .mini{width:74px;height:82px}
.item .mini svg{display:block;width:74px;height:82px}
.item .iname{font-size:.9rem;font-weight:700;line-height:1.1;text-align:center}
.item.on{outline:4px solid var(--grape);outline-offset:2px}
.item.on::after{content:"✓";position:absolute;top:4px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--grape);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.9rem}
.item.locked .mini,.item.locked .sw{filter:grayscale(.7);opacity:.55}
.item .lock{position:absolute;top:6px;left:6px;background:var(--sun);color:var(--on);border:2px solid var(--line);border-radius:999px;font-size:.85rem;font-weight:800;padding:0 7px;line-height:1.5}
.item.afford .lock{background:var(--grass);animation:wiggle 2.4s infinite}
.sw{width:60px;height:60px;border-radius:50%;border:3px solid var(--line);margin:10px 0 8px}
.note{background:var(--paper);border:3px dashed var(--line);border-radius:18px;padding:10px 14px;font-weight:600;margin:6px 0}

/* Forms */
.form{display:flex;flex-direction:column;gap:16px;margin-top:10px}
.label{font-weight:800;font-size:1.3rem}
.input{width:100%;min-height:60px;font:inherit;font-size:1.5rem;font-weight:700;padding:6px 18px;border:3px solid var(--line);border-radius:18px;background:var(--paper);color:var(--text)}
.ages{display:flex;gap:10px;flex-wrap:wrap}
.age{width:64px;height:64px;border-radius:50%;border:3px solid var(--line);background:var(--paper);font-weight:800;font-size:1.6rem;box-shadow:0 4px 0 var(--line)}
.age.on{background:var(--sun);color:var(--on)}

/* Games shared */
.game{display:flex;flex-direction:column;gap:16px}
.prompt{display:flex;align-items:center;gap:12px;padding:12px 14px}
.prompt .who{font-size:3.2rem;line-height:1;flex:none}
.prompt .say{flex:1;font-weight:700;font-size:1.3rem}
.prompt .say b{font-size:1.6rem}
.hear{flex:none;width:48px;height:48px;border-radius:50%;border:3px solid var(--line);background:var(--sun);color:var(--on);font-size:1.3rem;display:grid;place-items:center}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.msg{min-height:1.6em;text-align:center;font-weight:800;font-size:1.25rem}
.msg.good{color:#1E9E4A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .msg.good{color:#7BEA9C}}
:root[data-theme="dark"] .msg.good{color:#7BEA9C}

/* Letter Monster */
.lm-stage{display:flex;align-items:center;justify-content:center;gap:10px}
.monster{width:min(46vw,200px);flex:none}
.monster .mouth{transform-box:fill-box;transform-origin:center}
.monster.chomp .mouth{animation:chomp .6s ease-in-out 2}
.bubble{display:flex;flex-direction:column;align-items:center;padding:10px 16px;background:var(--paper);border:3px solid var(--line);border-radius:24px;box-shadow:0 5px 0 var(--line);min-width:130px}
.bubble-small{font-weight:700;font-size:1.05rem}
.bubble-letter{font-weight:800;font-size:3.6rem;line-height:1;margin:4px 0}
.bubble-hear{font-size:.95rem;font-weight:700;color:var(--soft)}
.opts{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
.opts.opts-4{grid-template-columns:1fr 1fr}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:128px;padding:8px}
.opt .emo{font-size:3.6rem;line-height:1.1}
.opt .lbl{font-weight:800;font-size:1.2rem}
.opt:disabled{opacity:.25}
.opt.eaten{animation:eaten .7s forwards}

/* Bakery */
.tray{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tray-btn{width:108px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.tray-btn .emo{font-size:3rem;line-height:1.1}
.tray-btn .lbl{font-weight:700;font-size:.95rem}
.plate{min-height:150px;border-radius:50%/40%;background:var(--paper);border:3px solid var(--line);box-shadow:0 5px 0 var(--line),inset 0 0 0 12px var(--bg);padding:24px 28px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:center}
.pl-item{font-size:2.3rem;line-height:1;width:48px;height:48px;display:grid;place-items:center;animation:drop .25s ease-out}
.plate-empty{color:var(--soft);font-weight:700}
.dots{letter-spacing:4px;font-size:1.1rem;color:var(--tomato)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.num{min-height:84px;font-size:2.4rem;font-weight:800}

/* Store */
.shop-item{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px}
.shop-item .emo{font-size:4.4rem;line-height:1}
.tag{background:var(--sun);color:var(--on);border:3px solid var(--line);border-radius:14px 30px 30px 14px;padding:4px 18px 4px 14px;font-weight:800;font-size:2.4rem;box-shadow:0 4px 0 var(--line)}
.coins{display:flex;gap:14px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.coin{width:var(--d);height:var(--d);border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:1.05rem;color:#2B1B3D;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15),inset 0 0 0 5px rgba(255,255,255,.35),0 4px 0 var(--line);flex:none}
.coin-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:.9rem}
.counter{min-height:110px;padding:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center}
.counter .coin{animation:drop .25s ease-out}
.counter-label{font-weight:800;text-align:center;margin-bottom:-6px}

/* Word builder */
.wb-pic{font-size:5rem;text-align:center;line-height:1.1}
.slots{display:flex;gap:8px;justify-content:center}
.slot{width:min(16vw,64px);height:min(19vw,76px);border-radius:16px;border:3px dashed var(--soft);display:grid;place-items:center;font-size:2.4rem;font-weight:800;background:transparent;text-transform:uppercase}
.slot.full{border-style:solid;border-color:var(--line);background:var(--sky);color:var(--on);box-shadow:0 4px 0 var(--line)}
.slot .ghost{color:var(--ghost)}
.wtiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wtile{width:min(17vw,68px);height:min(17vw,68px);font-size:2.3rem;font-weight:800;background:var(--sun);color:var(--on);text-transform:uppercase}
.wtile:disabled{opacity:.2}
.slots.bad{animation:shake .45s}

/* Arcade games (a canvas that fills the screen under the top bar) */
.arcade{position:relative;height:calc(100vh - 124px);height:calc(100dvh - 124px);min-height:430px;max-height:1000px;border:3px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);overflow:hidden;background:#120A26;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.arcade canvas{display:block}
.arcade-msg{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:24px;background:#120A26;color:#fff;font-weight:800;font-size:1.3rem;text-align:center}
.arcade-detail{margin-top:10px;font-size:1rem;font-weight:600;opacity:.75;overflow-wrap:anywhere}

/* Overlays */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--text);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);padding:10px 18px;font-weight:800;font-size:1.1rem;z-index:50;width:max-content;max-width:calc(100% - 28px);text-align:center;animation:drop .25s ease-out}
.modal-bg{position:fixed;inset:0;background:rgba(20,10,35,.55);display:grid;place-items:center;z-index:60;padding:20px}
.modal{max-width:380px;width:100%;padding:20px;text-align:center}
.modal p{font-size:1.4rem;font-weight:800;margin:4px 0 16px}
.modal .row{justify-content:center}
.confetti{position:fixed;left:50%;top:40%;font-size:1.8rem;pointer-events:none;z-index:40;animation:fly 1s ease-out forwards}

.shake{animation:shake .45s}
.pop{animation:pop .45s}
.bounce{animation:bounce .6s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-12px)}65%{transform:translateY(2px)}}
@keyframes chomp{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.12)}}
@keyframes eaten{to{transform:scale(.2) translateY(-60px);opacity:0}}
@keyframes drop{from{transform:translateY(-10px) scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes wiggle{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-8deg)}97%{transform:rotate(8deg)}}
@keyframes fly{from{transform:translate(-50%,0) scale(.6);opacity:1}to{transform:translate(calc(-50% + var(--x)),var(--y)) scale(1.2) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}.homebtns{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<script>
(function(){
'use strict';
const app = document.getElementById('app');
const $ = s => document.querySelector(s);
const INK = '#2B1B3D';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = a => a[Math.floor(Math.random()*a.length)];
const rint = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- Avatar catalog ---------- */
const CHARS = [
  {id:'puppy', kind:'Animals', name:'Puppy', cost:0, head:'round', ears:'floppy', nose:'dog'},
  {id:'kitty', kind:'Animals', name:'Kitty', cost:0, head:'round', ears:'pointy', nose:'cat'},
  {id:'bunny', kind:'Animals', name:'Bunny', cost:0, head:'round', ears:'long', nose:'bunny'},
  {id:'bear', kind:'Animals', name:'Bear', cost:20, head:'round', ears:'round', snout:true},
  {id:'panda', kind:'Animals', name:'Panda', cost:40, head:'round', ears:'round', snout:true, panda:true, fixed:'#FFFFFF'},
  {id:'dragon', kind:'Animals', name:'Dragon', cost:80, head:'round', horns:'big', spikes:true, snout:true, fangs:true},
  {id:'unicorn', kind:'Animals', name:'Unicorn', cost:100, head:'round', ears:'pointy', unihorn:true, mane:true, nose:'cat'},
  {id:'kid', kind:'People', name:'Short hair', cost:0, human:true, hair:'short'},
  {id:'pigtails', kind:'People', name:'Pigtails', cost:0, human:true, hair:'pigtails'},
  {id:'curly', kind:'People', name:'Curly', cost:0, human:true, hair:'curly'},
  {id:'pirate', kind:'People', name:'Pirate', cost:30, human:true, hair:'none', pirate:true},
  {id:'wizard', kind:'People', name:'Wizard', cost:60, human:true, hair:'long', wizard:true},
  {id:'astronaut', kind:'People', name:'Astronaut', cost:120, human:true, hair:'short', helmet:true},
  {id:'fuzzy', kind:'Monsters', name:'Fuzzy', cost:0, head:'blob', tufts:true, fangs:true},
  {id:'cyclops', kind:'Monsters', name:'One Eye', cost:0, head:'blob', eyes:1, horns:'small'},
  {id:'horns', kind:'Monsters', name:'Big Horns', cost:25, head:'blob', horns:'big', fangs:true},
  {id:'slime', kind:'Monsters', name:'Slime', cost:50, head:'drip'},
  {id:'threeeye', kind:'Monsters', name:'Three Eyes', cost:75, head:'blob', eyes:3, fangs:true, horns:'small'},
  {id:'zip', kind:'Aliens', name:'Zip', cost:0, head:'oval', antenna:2},
  {id:'bloop', kind:'Aliens', name:'Bloop', cost:0, head:'oval', antenna:1, eyes:1},
  {id:'robot', kind:'Aliens', name:'Robot', cost:60, head:'robot', antenna:1, robot:true},
  {id:'king', kind:'Aliens', name:'Alien King', cost:150, head:'oval', eyes:3, antenna:2, crown:true}
];
const KINDS = ['Animals','People','Monsters','Aliens'];
const COLORS = [
  {id:'sun', name:'Sunny', v:'#FFC94A', cost:0},
  {id:'tomato', name:'Red', v:'#FF6B5E', cost:0},
  {id:'sky', name:'Blue', v:'#4FC3F7', cost:0},
  {id:'grass', name:'Green', v:'#6CD47A', cost:0},
  {id:'grape', name:'Purple', v:'#A77BF3', cost:0},
  {id:'pink', name:'Pink', v:'#FF8FC7', cost:0},
  {id:'orange', name:'Orange', v:'#FF9F43', cost:0},
  {id:'brown', name:'Brown', v:'#C08A5F', cost:0},
  {id:'gold', name:'Gold', grad:'gold', css:'linear-gradient(135deg,#FFF0A0,#F5B700,#FFD84D)', cost:30},
  {id:'galaxy', name:'Galaxy', grad:'gal', css:'linear-gradient(135deg,#2E1A6B,#7B4AE2,#25B5E0)', cost:50}
];
const SKIN = [

/* ---------- State & saving ----------
   Everything is saved in this browser's localStorage (one save per device/browser). */
const LS = 'smarty-stars-v1';
let S = {players:[], sound:true, updated:0};
try { const r = localStorage.getItem(LS); if (r) { const d = JSON.parse(r); if (d && Array.isArray(d.players)) S = Object.assign(S, d); } } catch(e){}
let cur = null, SCREEN = 'who', G = null, ED = null, NEW = null, EDP = null, EDITMODE = false;
const P = () => S.players.find(p => p.id === cur);
const big = () => (P() ? P().age : 4) >= 6;   // ages 6-8 get the harder levels
function save(){
  S.updated = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){}
}

/* ---------- Speech, feedback ----------
   Everything is spoken by narrator.js, which plays recorded clips from voice/ (a natural voice made with
   Kokoro) and falls back to the device voice for anything not recorded.
   A NEW SPOKEN LINE NEEDS RECORDING: add it to tools/voice_lines.py, re-run it and the recorder
   (see README), and bump VOICE_BUILD. Each sentence is looked up on its own, so keep dynamic parts
   (numbers, names) in their own short sentence. */
const VOICE_BUILD = '2';
if (window.Narrator) Narrator.load('voice/index.json?v=' + VOICE_BUILD);
function say(text){
  if (S.sound === false || !window.Narrator) return;
  Narrator.say(text);
}
function hush(){ if (window.Narrator) Narrator.stop(); }
function toast(text){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
function confirmBox(text, yes, yesLabel){
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal card" role="dialog" aria-modal="true"><p>${esc(text)}</p><div class="row"><button class="btn alt" data-m="no">Not now</button><button class="btn go" data-m="yes">${esc(yesLabel||'Yes!')}</button></div></div>`;
  bg.addEventListener('click', e => {
    const b = e.target.closest('[data-m]');
    if (e.target === bg || (b && b.dataset.m === 'no')) bg.remove();
    else if (b && b.dataset.m === 'yes'){ bg.remove(); yes(); }
  });
  document.body.appendChild(bg);
  const y = bg.querySelector('[data-m="yes"]'); if (y) y.focus();
}
function confetti(){
  const set = ['⭐','✨','🌟','🎉'];
  for (let i=0;i<10;i++){
    const s = document.createElement('span'); s.className = 'confetti emo'; s.textContent = pick(set);
    s.style.setProperty('--x', rint(-160,160)+'px'); s.style.setProperty('--y', rint(-220,60)+'px'); s.style.setProperty('--r', rint(-180,180)+'deg');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1100);
  }
}
function replay(el, cls){ if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
const allItems = () => Object.keys(CATALOG).flatMap(t => CATALOG[t].map(x => Object.assign({type:t}, x)));
function owned(type, id, p){
  const it = findItem(type, id); if (!it) return false;
  if (!it.cost) return true;
  return !!(p && p.unlocked.includes(type + ':' + id));
}
function addStar(n){
  n = n || 1;
  const p = P(); if (!p) return;
  const before = p.stars; p.stars += n; save();
  const sc = $('#starCount'); if (sc){ sc.textContent = '⭐ ' + p.stars; replay(sc,'pop'); }
  replay($('#meAv'),'bounce');
  confetti();
  const newly = allItems().some(it => it.cost > before && it.cost <= p.stars && !owned(it.type, it.id, p));
  if (newly) setTimeout(() => toast('🎁 You have enough stars to unlock something new!'), 900);
}
function cheer(extra){ const c = pick(CHEERS); say(extra ? c + ' ' + extra : c); return c; }
function setMsg(t, good){ const m = $('#msg'); if (m){ m.textContent = t; m.className = 'msg' + (good ? ' good' : ''); } }

/* ---------- Screens ---------- */
function go(s){ SCREEN = s; render(); window.scrollTo(0,0); }
let MOUNTED = null;   // an arcade game whose canvas is running right now
function render(){
  gid = 0;
  // Arcade games run until the screen changes: stop the one on screen before drawing anything new.
  if (MOUNTED){ const m = MOUNTED; MOUNTED = null; try { m.unmount(); } catch(e){} }
  const game = gameById(SCREEN);
  if ((game || SCREEN === 'home') && !P()) { SCREEN = 'who'; return renderWho(); }
  if (game){
    if (!G || G.game !== game.id) { SCREEN = 'home'; return renderHome(); }
    app.innerHTML = topbar(game.name) + `<main class="game">${game.render()}</main>`;
    if (game.mount){ MOUNTED = game; game.mount(app.querySelector('main.game')); }
    return;
  }
  ({who:renderWho, create:renderCreate, editp:renderEditP, home:renderHome, look:renderLook}[SCREEN] || renderWho)();
}
function wordmark(){
  // Each word stays on one line; the title only wraps between words.
  let n = 0;
  const word = w => `<span class="w" aria-hidden="true">${w.split('').map(ch => `<span class="L c${n++ % 5}">${ch}</span>`).join('')}</span>`;
  return `<h1 class="mark" aria-label="Smarty Stars">${word('Smarty')}${word('Stars')}</h1>`;
}

/* ---------- Look editor ---------- */
function startLook(mode){
  ED = {mode, tab:'char', av: Object.assign({}, DEFAULT_AV, mode === 'create' ? {} : P().avatar)};
  go('look');
}
function itemBtn(type, it, preview){
  const p = ED.mode === 'create' ? null : P();
  const has = owned(type, it.id, p);
  const on = ED.av[type] === it.id;
  const afford = !has && p && p.stars >= it.cost;
  return `<button class="item card ${on?'on':''} ${has?'':'locked'} ${afford?'afford':''}" data-act="pick" data-type="${type}" data-id="${it.id}" aria-pressed="${on}" aria-label="${esc(it.name)}${has?'':', costs '+it.cost+' stars'}">
    ${has ? '' : `<span class="lock">🔒 ${it.cost}⭐</span>`}
    ${preview}<span class="iname">${esc(it.name)}</span></button>`;
}
function renderLook(){
  const av = ED.av, c = charOf(av.char);
  const p = ED.mode === 'create' ? null : P();
  const name = ED.mode === 'create' ? NEW.name : p.name;
  const stars = p ? p.stars : 0;
  const tabs = [['char','Character'],['color',c.human?'Skin & hair':'Color'],['outfit','Outfit'],['acc','Extras']];
  let body = '';
  if (ED.tab === 'char'){
    body = KINDS.map(kd => `<h3 class="grouph">${kd}</h3><div class="items">${CHARS.filter(x => x.kind === kd).map(it => itemBtn('char', it, `<div class="mini">${avatarSVG(Object.assign({}, av, {char:it.id, acc:'none'}))}</div>`)).join('')}</div>`).join('');
  } else if (ED.tab === 'color'){
    if (c.human){
      body = `<h3 class="grouph">Skin</h3><div class="items">${SKIN.map(it => itemBtn('skin', it, `<div class="sw" style="background:${it.v}"></div>`)).join('')}</div>`;
      if (c.hair !== 'none') body += `<h3 class="grouph">Hair</h3><div class="items">${HAIR.map(it => itemBtn('hair', it, `<div class="sw" style="background:${it.v}"></div>`)).join('')}</div>`;
    } else if (c.fixed){
      body = `<p class="note">Pandas are always black and white! Pick a different character to choose a color.</p>`;
    } else {
      body = `<div class="items">${COLORS.map(it => itemBtn('color', it, `<div class="sw" style="background:${it.css||it.v}"></div>`)).join('')}</div>`;
    }
  } else if (ED.tab === 'outfit'){
    body = `<div class="items">${OUTFITS.map(it => itemBtn('outfit', it, `<div class="mini">${avatarSVG(Object.assign({}, av, {outfit:it.id}))}</div>`)).join('')}</div>`;
  } else {
    body = `<div class="items">${ACCS.map(it => itemBtn('acc', it, `<div class="mini">${avatarSVG(Object.assign({}, av, {acc:it.id}))}</div>`)).join('')}</div>`;
  }
  app.innerHTML = `<div class="look-top">
    <div class="look-prev">${avatarSVG(av)}</div>
    <div class="look-info"><h2>${esc(name)}</h2><p class="st" style="font-weight:800;font-size:1.2rem;margin:4px 0 10px">⭐ ${stars} stars</p>
    <button class="btn go" data-act="lookDone">Done ✓</button></div>
  </div>
  ${ED.mode === 'create' ? '<p class="note">🔒 Play the games to earn stars and unlock cooler characters and outfits!</p>' : ''}
  <div class="tabs" role="tablist">${tabs.map(t => `<button class="tab ${ED.tab===t[0]?'on':''}" role="tab" aria-selected="${ED.tab===t[0]}" data-act="tab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
  ${body}`;
}
function pickItem(type, id){
  const it = findItem(type, id); if (!it) return;
  const p = ED.mode === 'create' ? null : P();
  const apply = () => { ED.av[type] = id; render(); };
  if (owned(type, id, p)) return apply();
  const stars = p ? p.stars : 0;
  if (p && stars >= it.cost){
    confirmBox(`Unlock ${it.name} for ${it.cost} ⭐?`, () => {
      p.stars -= it.cost; p.unlocked.push(type + ':' + id);
      ED.av[type] = id; p.avatar = Object.assign({}, ED.av); save();
      confetti(); say('Yay! You unlocked ' + it.name + '!'); render();
    }, 'Unlock!');
  } else {
    const need = it.cost - stars;
    toast(`Earn ${need} more ⭐ in the games to unlock ${it.name}!`);
    say(`You need ${need} more ${need === 1 ? 'star' : 'stars'}. Play the games to unlock ${it.name}!`);
  }
}

/* =====================================================================
   GAMES
   Each game is one block below that ends with addGame({...}):
     id        short name, also used as the screen name (e.g. 'letter')
     name      title on the home tile and the top bar
     emoji     big picture on the home tile
     blurb     small words under the name on the tile
     color     tile color, e.g. 'var(--sun)' or '#FF9F43'
     newRound  makes a new question: sets G = {game:id, prompt:'...', ...} then calls showRound()
     render    returns the HTML for the game area (the top bar is added for you)
     actions   click handlers: a button with data-act="xyz" calls actions.xyz(data, button)
   Helpers any game can use: big() (true for ages 6-8), P() (the current player),
   addStar(), cheer(), setMsg(), say(), nextRound(ms), pick(), rint(), shuffle(), esc().
   Home tiles appear in the same order the games are added.
   Arcade games (their own file in games/, using window.SmartyStars) can also have:
     mount(mainEl)  called after the game's HTML is on screen (start the canvas here)
     unmount()      called when the child leaves the game (stop everything here)
   ===================================================================== */
const GAMES = [];
const addGame = g => GAMES.push(g);
const gameById = id => GAMES.find(g => g.id === id);
function startGame(id){
  const g = gameById(id); if (!g) return;
  SCREEN = id; G = null; window.scrollTo(0,0);
  g.newRound();
}
function showRound(){ render(); say(G.prompt); }
// After a right answer, start the next question after a short pause,
// but only if the child is still on that same question (not back home or in another game).
function nextRound(ms){
  const round = G;
  setTimeout(() => { if (G === round && SCREEN === round.game) gameById(round.game).newRound(); }, ms);
}

/* ---------- GAME: Letter Monster ---------- */
function lmNew(){
  const b = big();
  const ends = b && Math.random() < .3;
  const key = w => { const l = letters(w); return ends ? l.slice(-1) : l[0]; };
  // Only use pictures whose letter matches the sound kids hear: "ends with" skips
  // silent-e and sh/ch/ow/ey endings (cake, fish, cow, key); "starts with" skips sh/ch/th (ship).
  const fair = w => { const l = letters(w); return ends ? !/([^e]e|h|w|y)$/.test(l) : !/^(sh|ch|th)/.test(l); };
  const pool = PICS.filter(p => fair(p[0]));
  const target = pick(pool);
  const L = key(target[0]);
  const used = new Set([L]);
  const others = shuffle(pool).filter(p => { const kk = key(p[0]); if (used.has(kk)) return false; used.add(kk); return true; }).slice(0, b ? 3 : 2);
  G = {game:'letter', target, L, ends, opts: shuffle([target].concat(others)), gone:[], done:false};
  G.prompt = `Feed me something that ${ends?'ends':'starts'} with ${L.toUpperCase()}!`;
  showRound();
}
function renderLetter(){
  const b = big();
  return `
    <div class="lm-stage">
      <div class="monster" id="monster">${MONSTER}</div>
      <button class="bubble" data-act="hear" aria-label="Hear it again">
        <span class="bubble-small">Feed me something that ${G.ends?'ends':'starts'} with</span>
        <span class="bubble-letter">${G.L.toUpperCase()}${G.L}</span>
        <span class="bubble-hear">🔊 Tap to hear</span>
      </button>
    </div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="opts opts-${G.opts.length}">
      ${G.opts.map((o,i) => `<button class="opt card" data-act="lmPick" data-i="${i}" aria-label="${esc(o[0])}" ${G.gone.includes(i)?'disabled':''}><span class="emo">${o[1]}</span>${b?`<span class="lbl">${esc(o[0])}</span>`:''}</button>`).join('')}
    </div>`;
}
function lmPick(i, el){
  if (G.done) return;
  const o = G.opts[i];
  if (o === G.target){
    G.done = true;
    el.classList.add('eaten'); replay($('#monster'),'chomp');
    const c = cheer(`${o[0]} ${G.ends?'ends':'starts'} with ${G.L.toUpperCase()}!`);
    setMsg(c + ' Yum!', true); addStar();
    nextRound(1700);
  } else {
    replay(el,'shake'); G.gone.push(i); el.disabled = true;
    const l = letters(o[0]); const k = G.ends ? l.slice(-1) : l[0];
    setMsg(`${o[0][0].toUpperCase()+o[0].slice(1)} ${G.ends?'ends':'starts'} with ${k.toUpperCase()}. Try again!`);
    say(`That’s ${o[0]}. ${o[0]} ${G.ends?'ends':'starts'} with ${k.toUpperCase()}. Try again!`);
  }
}
addGame({
  id:'letter', name:'Letter Monster', emoji:'👾', blurb:'Feed it the right letter', color:'var(--tomato)',
  newRound: lmNew, render: renderLetter,
  actions: { lmPick: (d, el) => lmPick(+d.i, el) }
});

/* ---------- GAME: Counting Bakery ---------- */
function cbNew(){
  const p = P(), b = big();
  const types = shuffle(TREATS);
  let order, tray;
  if (!b){
    const max = p.age <= 4 ? 5 : 10;
    order = [{t:types[0], n:rint(1,max)}];
    tray = p.age <= 4 ? [types[0]] : shuffle([types[0], types[1]]);
  } else {
    const max = p.age <= 6 ? 5 : 9;
    order = [{t:types[0], n:rint(1,max)}, {t:types[1], n:rint(1,max)}];
    tray = shuffle([types[0], types[1], types[2]]);
  }
  G = {game:'count', order, tray, plate:[], cust:pick(CUSTOMERS), stage:'serve', done:false};
  const amt = o => o.n + ' ' + (o.n===1 ? o.t.one : o.t.many);
  // spoken in short sentences so each one can be a recorded clip
  G.prompt = order.length === 1 ? `Can I have ${amt(order[0])}, please?` : `Can I have ${amt(order[0])}? And ${amt(order[1])}, please!`;
  showRound();
}
function renderCount(){
  const p = P();
  const orderHTML = G.order.map(o => `<b>${o.n}</b> ${o.n===1?o.t.one:o.t.many} <span class="emo">${o.t.e}</span>${p.age<=4?`<br><span class="dots" aria-hidden="true">${'●'.repeat(o.n)}</span>`:''}`).join(' and ');
  const bonus = G.stage === 'total';
  let lower;
  if (bonus){
    lower = `<div class="prompt card"><div class="say">Bonus! How many treats did you serve in all?</div></div>
      <div class="nums">${G.choices.map(n => `<button class="num card" data-act="cbTotal" data-n="${n}" ${G.wrong.includes(n)?'disabled':''}>${n}</button>`).join('')}</div>`;
  } else {
    lower = `<div class="tray">${G.tray.map(t => `<button class="tray-btn card" data-act="cbAdd" data-t="${t.id}" aria-label="Add a ${t.one}"><span class="emo">${t.e}</span><span class="lbl">Add ${t.one}</span></button>`).join('')}</div>
      <div style="text-align:center"><button class="btn go" data-act="cbServe" ${G.done?'disabled':''}>Serve the order!</button></div>`;
  }
  // During the bonus question the plate is just for counting, so its treats aren't buttons.
  const plateItem = (id,i) => bonus ? `<span class="pl-item emo">${TREATS.find(t=>t.id===id).e}</span>`
    : `<button class="pl-item emo" data-act="cbRemove" data-i="${i}" aria-label="Take back">${TREATS.find(t=>t.id===id).e}</button>`;
  return `
    <div class="prompt card"><div class="who emo" aria-hidden="true">${G.cust}</div><div class="say">${bonus ? 'Thank you!' : 'Can I have ' + orderHTML + ', please?'}</div>
      <button class="hear" data-act="hear" aria-label="Hear it again">🔊</button></div>
    <div class="plate" aria-label="Plate">${G.plate.length ? G.plate.map(plateItem).join('') : '<span class="plate-empty">Tap a treat to put it on the plate</span>'}</div>
    <div class="msg" id="msg" aria-live="polite"></div>
    ${lower}`;
}
function cbAdd(id){
  if (G.done || G.stage !== 'serve' || G.plate.length >= 20) return;
  G.plate.push(id); render();
  const t = TREATS.find(x => x.id === id);
  const n = G.plate.filter(x => x === id).length;
  say(n + ' ' + (n===1?t.one:t.many));
}
function cbRemove(i){ if (G.done || G.stage !== 'serve') return; G.plate.splice(i,1); render(); }
function cbServe(){
  if (G.done || G.stage !== 'serve') return;
  const counts = {}; G.plate.forEach(id => counts[id] = (counts[id]||0) + 1);
  const ok = G.order.every(o => counts[o.t.id] === o.n) && G.plate.every(id => G.order.some(o => o.t.id === id));
  if (ok){
    G.done = true; addStar();
    if (big()){
      const total = G.order.reduce((a,o) => a + o.n, 0);
      const set = new Set([total]); while (set.size < 4){ const v = total + rint(-3,3); if (v > 0) set.add(v); }
      G.choices = shuffle([...set]); G.wrong = []; G.stage = 'total'; G.done = false;
      G.prompt = 'Bonus question! How many treats did you serve in all?';   // what the 🔊 button repeats now
      const c = pick(CHEERS);
      render(); setMsg(c + ' Order served!', true);
      say(c + ' ' + G.prompt);
    } else {
      const c = cheer('Order served!'); setMsg(c + ' Order served!', true);
      nextRound(1600);
    }
  } else {
    const wrongType = G.plate.find(id => !G.order.some(o => o.t.id === id));
    let t;
    if (wrongType){ const wt = TREATS.find(x => x.id === wrongType); t = `Oops, I didn’t order any ${wt.many}. Tap one to take it back.`; }
    else {
      const o = G.order.find(o => (counts[o.t.id]||0) !== o.n);
      const have = counts[o.t.id] || 0;
      t = `Let’s count again! I asked for ${o.n} ${o.n===1?o.t.one:o.t.many}. You have ${have}.`;
    }
    setMsg(t); say(t); replay($('.plate'),'shake');
  }
}
function cbTotal(n, el){
  if (G.done) return;
  const total = G.order.reduce((a,o) => a + o.n, 0);
  if (n === total){
    G.done = true; addStar();
    const c = cheer(G.order[0].n + ' plus ' + G.order[1].n + ' is ' + total + '!');
    setMsg(`${c} ${G.order[0].n} + ${G.order[1].n} = ${total}`, true);
    nextRound(1900);
  } else {
    replay(el,'shake'); el.disabled = true; G.wrong.push(n);
    setMsg('Not quite. Count all the treats on the plate!'); say('Not quite. Count all the treats on the plate!');
  }
}
addGame({
  id:'count', name:'Counting Bakery', emoji:'🧁', blurb:'Fill the orders', color:'var(--sun)',
  newRound: cbNew, render: renderCount,
  actions: {
    cbAdd: d => cbAdd(d.t),
    cbRemove: d => cbRemove(+d.i),
    cbServe: () => cbServe(),
    cbTotal: (d, el) => cbTotal(+d.n, el)
  }
});

/* ---------- GAME: Word Builder ---------- */
function wbNew(){
  const a = P().age;
  let len, extras;
  if (a <= 5){ len = 3; extras = 0; }
  else if (a === 6){ len = 4; extras = 1; }
  else { len = Math.random() < .5 ? 4 : 5; extras = 2; }
  const w = pick(WORDS[len]);
  const abc = 'abcdefghijklmnoprstuvwy'.split('').filter(ch => !w[0].includes(ch));
  const chars = w[0].split('').concat(shuffle(abc).slice(0, extras));
  G = {game:'word', word:w[0], emoji:w[1], tiles: shuffle(chars).map((ch,i) => ({ch, i, used:false})), slots:[], done:false, hint: a <= 5};
  G.prompt = `Spell ${w[0]}.`;
  showRound();
}
function renderWord(){
  const w = G.word;
  return `
    <div class="prompt card"><div class="say">Spell the picture!</div><button class="hear" data-act="hear" aria-label="Hear the word">🔊</button></div>
    <div class="wb-pic emo" aria-label="${esc(w)}">${G.emoji}</div>
    <div class="slots" id="slots">${w.split('').map((ch,i) => {
      const t = G.slots[i] !== undefined ? G.tiles.find(x => x.i === G.slots[i]) : null;
      return t ? `<button class="slot full" data-act="wbSlot" data-s="${i}" aria-label="Remove ${t.ch}">${t.ch}</button>` : `<div class="slot">${G.hint ? `<span class="ghost">${ch}</span>` : ''}</div>`;
    }).join('')}</div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="wtiles">${G.tiles.map(t => `<button class="wtile card" data-act="wbTile" data-i="${t.i}" ${t.used?'disabled':''}>${t.ch}</button>`).join('')}</div>`;
}
function wbTile(i){
  if (G.done) return;
  const t = G.tiles.find(x => x.i === i); if (!t || t.used || G.slots.length >= G.word.length) return;
  t.used = true; G.slots.push(i); say(t.ch.toUpperCase()); render();
  if (G.slots.length === G.word.length){
    const made = G.slots.map(s => G.tiles.find(x => x.i === s).ch).join('');
    if (made === G.word){
      G.done = true; addStar();
      const c = cheer(G.word.split('').join(', ') + '. ' + G.word + '!'); setMsg(c, true);
      nextRound(2000);
    } else {
      setMsg('Not quite! Try again.'); say('Not quite! Try again.');
      replay($('#slots'),'bad');
      const round = G;
      setTimeout(() => { if (G === round && SCREEN === 'word' && !G.done){ G.tiles.forEach(x => x.used = false); G.slots = []; render(); } }, 900);
    }
  }
}
function wbSlot(s){
  if (G.done) return;
  const removed = G.slots.splice(s);
  removed.forEach(i => { const t = G.tiles.find(x => x.i === i); if (t) t.used = false; });
  render();
}
addGame({
  id:'word', name:'Word Builder', emoji:'🔤', blurb:'Spell the picture', color:'var(--sky)',
  newRound: wbNew, render: renderWord,
  actions: {
    wbTile: d => wbTile(+d.i),
    wbSlot: d => wbSlot(+d.s)
  }
});

/* ---------- GAME: Toy Store ---------- */
function stNew(){
  const a = P().age;
  let price, coins;
  if (a <= 4){ price = rint(1,5); coins = [1]; }
  else if (a === 5){ price = rint(3,15); coins = [1,5]; }
  else if (a === 6){ price = rint(10,50); coins = [1,5,10]; }
  else { price = rint(15,99); coins = [1,5,10,25]; }
  const item = pick(SHOP);
  G = {game:'store', item, price, coins, counter:[], done:false};
  G.prompt = `Ooh, ${/^[aeiou]/.test(item[0]) ? 'an' : 'a'} ${item[0]}! It costs ${price} ${price===1?'cent':'cents'}. Tap the coins to pay.`;
  showRound();
}
function coinHTML(v, act, i){
  const c = COINS[v];
  return `<button class="coin" style="--d:${c.d}px;background:${c.bg}" data-act="${act}" ${act==='stAdd'?`data-v="${v}"`:`data-i="${i}"`} aria-label="${act==='stAdd'?'Add a':'Take back'} ${c.name}, ${v} ${v===1?'cent':'cents'}">${v}¢</button>`;
}
function renderStore(){
  return `
    <div class="shop-item card"><span class="emo" aria-hidden="true">${G.item[1]}</span><span class="tag">${G.price}¢</span><button class="hear" data-act="hear" aria-label="Hear it again">🔊</button></div>
    <div class="counter-label">Your coins on the counter</div>
    <div class="counter card">${G.counter.length ? G.counter.map((v,i) => coinHTML(v,'stRemove',i)).join('') : '<span class="plate-empty">Tap coins below to pay</span>'}</div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="coins">${G.coins.map(v => `<div class="coin-wrap">${coinHTML(v,'stAdd')}<span>${COINS[v].name}</span></div>`).join('')}</div>
    <div style="text-align:center"><button class="btn go" data-act="stPay" ${G.done?'disabled':''}>Pay</button></div>`;
}
function stAdd(v){ if (G.done || G.counter.length >= 24) return; G.counter.push(v); render(); say(v + (v===1?' cent':' cents')); }
function stRemove(i){ if (G.done) return; G.counter.splice(i,1); render(); }
function stPay(){
  if (G.done) return;
  const sum = G.counter.reduce((a,b) => a + b, 0);
  if (sum === G.price){
    G.done = true; addStar();
    const c = cheer(`That’s exactly ${G.price} ${G.price === 1 ? 'cent' : 'cents'}!`); setMsg(`${c} The ${G.item[0]} is yours!`, true);
    nextRound(1800);
  } else {
    const cents = n => n + (n === 1 ? ' cent' : ' cents');
    const t = sum < G.price ? `You gave ${sum}¢. You need ${G.price - sum}¢ more.` : `You gave ${sum}¢. That’s too much! Take some coins back.`;
    setMsg(t);
    say(sum < G.price ? `You gave ${cents(sum)}. You need ${cents(G.price - sum)} more.` : 'That’s too much! Take some coins back.');
    replay($('.counter'),'shake');
  }
}
addGame({
  id:'store', name:'Toy Store', emoji:'🪙', blurb:'Pay with coins', color:'var(--grass)',
  newRound: stNew, render: renderStore,
  actions: {
    stAdd: d => stAdd(+d.v),
    stRemove: d => stRemove(+d.i),
    stPay: () => stPay()
  }
});

/* ---------- Actions ---------- */
function readName(obj){ const el = $('#nm'); if (el) obj.name = el.value.trim(); }
const ACT = {
  choosePlayer: d => { cur = d.id; go('home'); if (P()) say('Hi, superstar! Pick a game.'); },
  newPlayer: () => { NEW = {name:'', age:null}; EDITMODE = false; go('create'); setTimeout(() => { const el = $('#nm'); if (el) el.focus(); }, 50); },
  editPlayers: () => { EDITMODE = !EDITMODE; go('who'); },
  editPlayer: d => { const p = S.players.find(x => x.id === d.id); if (!p) return; EDP = {id:p.id, name:p.name, age:p.age, stars:p.stars}; go('editp'); },
  age: d => { const a = +d.a; if (SCREEN === 'create'){ readName(NEW); NEW.age = a; } else { readName(EDP); EDP.age = a; } render(); },
  createNext: () => {
    readName(NEW);
    if (!NEW.name){ toast('Type your name first!'); const el = $('#nm'); if (el) el.focus(); return; }
    if (!NEW.age){ toast('Tap how old you are!'); return; }
    startLook('create');
  },
  saveP: () => {
    readName(EDP); const p = S.players.find(x => x.id === EDP.id); if (!p) return go('who');
    if (!EDP.name){ toast('Names can’t be empty.'); return; }
    p.name = EDP.name; p.age = EDP.age; save(); EDITMODE = false; go('who');
  },
  delP: () => {
    confirmBox(`Delete ${EDP.name}? Their stars and prizes will be gone.`, () => {
      S.players = S.players.filter(x => x.id !== EDP.id); if (cur === EDP.id) cur = null; save(); EDITMODE = false; go('who');
    }, 'Delete');
  },
  who: () => go('who'),
  home: () => { hush(); G = null; go('home'); },
  look: () => startLook('edit'),
  tab: d => { ED.tab = d.t; render(); },
  pick: d => pickItem(d.type, d.id),
  lookDone: () => {
    if (ED.mode === 'create'){
      const p = {id:uid(), name:NEW.name, age:NEW.age, stars:0, unlocked:[], avatar:Object.assign({}, ED.av)};
      S.players.push(p); cur = p.id; save(); go('home'); say('Welcome, superstar! Pick a game to start earning stars.');
    } else { P().avatar = Object.assign({}, ED.av); save(); go('home'); }
  },
  sound: () => {
    S.sound = S.sound === false; save();
    if (S.sound === false) hush();
    const b = $('#soundBtn'); if (b) b.textContent = SCREEN === 'home' ? (S.sound ? '🔊 Sound on' : '🔇 Sound off') : (S.sound ? '🔊' : '🔇');
    if (S.sound) say('Sound on!');
  },
  game: d => startGame(d.g),
  hear: () => G && say(G.prompt)
};
// A click on anything with data-act="name" runs ACT.name, or the current game's actions.name.
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const game = gameById(SCREEN);
  const f = ACT[t.dataset.act] || (game && game.actions && game.actions[t.dataset.act]);
  if (f) f(t.dataset, t);
});
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'nm'){ e.preventDefault(); if (SCREEN === 'create') ACT.createNext(); else if (SCREEN === 'editp') ACT.saveP(); }
});

/* ---------- For bigger games that live in their own file (games/*.js) ---------- */
window.SmartyStars = {
  addGame, say, hush, addStar, save, pick, rint, shuffle, esc,
  player: P,                                   // the current player {name, age, stars, ...}
  soundOn: () => S.sound !== false,
  startRound: round => { G = round; showRound(); }   // same as a game block setting G then calling showRound()
};

render();
})();
</script>
